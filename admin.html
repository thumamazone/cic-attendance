<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CIC Admin — Attendance View</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; }
    h1 { color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white;
            border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    th { background: #0f3460; color: white; padding: 12px 16px; text-align: left; font-size: 13px; }
    td { padding: 11px 16px; font-size: 13px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f9fbff; }
    .count { font-size: 14px; font-weight: 600; color: #0f3460; margin-bottom: 12px; }
    .filter { margin-bottom: 16px; }
    .filter input { padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px;
                    font-size: 14px; width: 100%; max-width: 320px; }
    .refresh-btn { padding: 10px 20px; background: #0f3460; color: white;
                   border: none; border-radius: 10px; cursor: pointer;
                   font-size: 14px; margin-bottom: 16px; }
    .refresh-btn:hover { opacity: 0.85; }
    .badge { background: #dcfce7; color: #166534; padding: 2px 10px;
             border-radius: 20px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <h1>📊 CIC Attendance Dashboard</h1>
  <p class="subtitle">Live view of attendance records</p>

  <button class="refresh-btn" onclick="loadAttendance()">🔄 Refresh</button>

  <div class="filter">
    <input type="text" id="searchBox" placeholder="🔍 Search by name, unit or meeting..."
           oninput="filterTable()"/>
  </div>

  <div class="count" id="countLabel">Loading...</div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Timestamp</th>
        <th>Meeting</th>
        <th>Name</th>
        <th>Unit</th>
        <th>Phone</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" style="text-align:center; color:#aaa;">Loading data...</td></tr>
    </tbody>
  </table>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwWkyxRAju_hpbUnoAHgg532_s23zkG3QwBcgL6RcJYiI78JZmw1z4T303l8FM2Gcuc/exec";
  let allRows = [];

  window.onload = loadAttendance;

  function loadAttendance() {
    document.getElementById("countLabel").textContent = "Loading...";
    document.getElementById("tableBody").innerHTML =
      '<tr><td colspan="6" style="text-align:center;color:#aaa;">Fetching data...</td></tr>';

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getAttendance" })
    })
    .then(r => r.json())
    .then(data => {
      allRows = data.rows || [];
      renderTable(allRows);
    })
    .catch(() => {
      document.getElementById("tableBody").innerHTML =
        '<tr><td colspan="6" style="text-align:center;color:red;">Failed to load data.</td></tr>';
    });
  }

  function renderTable(rows) {
    const tbody = document.getElementById("tableBody");
    document.getElementById("countLabel").textContent =
      "Total Attendance Records: " + rows.length;

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#aaa;">No records found.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${r[0]}</td>
        <td><span class="badge">${r[1]}</span> ${r[2]}</td>
        <td><strong>${r[4]}</strong></td>
        <td>${r[5]}</td>
        <td>${r[3]}</td>
      </tr>
    `).join("");
  }

  function filterTable() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const filtered = allRows.filter(r =>
      r.join(" ").toLowerCase().includes(q)
    );
    renderTable(filtered);
  }
</script>
</body>
</html>
